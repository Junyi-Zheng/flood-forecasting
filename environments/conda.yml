# How to install:
# conda env create -f environments/conda.yml

name: googlehydrology
channels:  # Keep order
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python
  - pytorch
  - pytorch-cuda
  - torchaudio
  - torchvision
  - absl-py
  - aiohttp
  - bokeh
  - cachey
  - cfgrib
  - dask
  - distributed
  - eccodes
  - fsspec
  - gcsfs
  - geopandas
  - gh
  - google-cloud-storage
  - h5netcdf
  - h5py  # Sets the underlying C library "hdf5", letting h5py set it.
  - icechunk
  - ipython
  - jupyter
  - matplotlib
  - more-itertools
  - nbsphinx
  - netcdf4
  - numpy
  - pandas
  - parso
  - pip
  - psutil
  - pydantic
  - pyproj
  - pytest
  - pytest-cov
  - pytest-xdist
  - python-eccodes
  - pyyaml
  - requests
  - ruamel.yaml
  - ruff
  - scipy
  - seaborn
  - shapely
  - sphinx
  - sphinx-rtd-theme
  - tensorboard
  - tqdm
  - xarray
  - zarr
  - pip:
    - dynamical-catalog
